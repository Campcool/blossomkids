name: Site Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      # worker/db/drizzle 不進正式站（next 靜態匯出不碰），但會影響
      # vinext build 與型別檢查，改壞了仍應在 PR 階段就被擋下。
      - 'worker/**'
      - 'db/**'
      - 'drizzle.config.ts'
      - '.github/workflows/site-check.yml'
  # 不再掛 push: main。同一次推送已由 deploy-pages.yml 跑過 tsc + build + test，
  # 而且那條才是真正擋部署的門禁；這裡重跑只是重複耗時。
  # 本 workflow 保留給 PR 前置檢查與 workflow_dispatch 的線上實測。

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: sitecheck-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Static export build
        env:
          STATIC_EXPORT: "1"
        run: npx next build
      - name: Full test suite
        run: npm test

  live-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live site
        run: |
          echo "=== 首頁狀態與伺服器標頭 ==="
          curl -sSI https://blossomkids.tw/ | head -12
          echo
          echo "=== 首頁引用的畢業照檔名 ==="
          curl -sS https://blossomkids.tw/ | grep -o 'graduation-30[^"]*' | sort -u || echo "(首頁抓不到 graduation 字樣)"
          echo
          echo "=== 首頁標題 ==="
          curl -sS https://blossomkids.tw/ | grep -o '<title>[^<]*' | head -1
          echo
          echo "=== GSC 驗證檔 ==="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://blossomkids.tw/google00a268e494d7ca7a.html
          curl -sS https://blossomkids.tw/google00a268e494d7ca7a.html | head -1 || true
          echo
          echo "=== 打碼新檔名圖片 ==="
          curl -sS -o /dev/null -w "HTTP %{http_code} size=%{size_download}\n" https://blossomkids.tw/images/graduation-30-masked.jpg
          echo
          echo "=== 舊檔名圖片（應為 404） ==="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://blossomkids.tw/images/graduation-30.jpg
